syntax = "proto3";

package com.app.pricing.grpc;

option java_multiple_files = true;
option java_package = "com.app.pricing.grpc";
option java_outer_classname = "PricingProto";

service PricingService {
  rpc GetBatchPrices (BatchPriceRequest) returns (BatchPriceResponse);
}

message BatchPriceRequest {
  repeated string productIds = 1;
}

message BatchPriceResponse {
  map<string, double> prices = 1;
}
